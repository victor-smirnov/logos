[package]
name = "http_hello_hyper"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "http_hello_hyper"
path = "src/main.rs"

[dependencies]
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["net", "rt", "macros", "signal"] }
bytes = "1"
socket2 = { version = "0.5", features = ["all"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
